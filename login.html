<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - BusTrack</title>

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- =====================================
         LOGIN CONTAINER
    ====================================== -->

    <div class="login-container">

        <div class="login-box">

            <!-- Bus Icon -->
            <div class="login-icon">
                🚌
            </div>


            <!-- Heading -->
            <h1>
                Welcome Back
            </h1>


            <p class="login-subtitle">
                Login to your BusTrack account
            </p>


            <!-- =================================
                 LOGIN FORM
            ================================== -->

            <form id="loginForm">

                <!-- Email -->

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <!-- Password -->

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    🔐 Login
                </button>

            </form>


            <!-- Register Link -->

            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


            <!-- Back Home -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>


        </div>

    </div>


    <!-- =====================================
         AUTH JAVASCRIPT
    ====================================== -->

    <script
        type="module"
        src="js/auth.js"
    ></script>


</body>

</html>
